<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css-variable.css" />
    <title>Playing CSS Variables With JS</title>
  </head>
  <body>
    <header>
      <h1>Update CSS Variables with <span>JS</span></h1>
    </header>
    <main>
      <section class="inputs-container">
        <div class="input-container">
          <label for="spacing-label">Spacing</label>
          <input type="range" name="spacing-input" id="spacing-label" />
        </div>
        <div class="input-container">
          <label for="blur-label">Blur</label>
          <input type="range" name="blur-input" id="blur-label" />
        </div>
        <div class="input-container">
          <label for="color-label">Base Color</label>
          <input type="color" name="color-input" id="color-label" />
        </div>
      </section>
      <section class="image-container">
        <img src="images/new-zealand.jpg" alt="new zealand image" />
      </section>
    </main>
    <footer></footer>
  </body>
</html>
